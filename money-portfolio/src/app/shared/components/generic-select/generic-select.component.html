<mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ label }}</mat-label>
    <mat-select [value]="selectedValue" (selectionChange)="onChange($event.value)">
      <mat-option *ngFor="let option of options" [value]="option.value">
        {{ option.label }}
      </mat-option>
    </mat-select>
  </mat-form-field>
